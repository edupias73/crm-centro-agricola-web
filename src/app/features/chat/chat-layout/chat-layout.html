<div class="flex flex-col h-screen bg-white font-sans overflow-hidden text-gray-800">
  <!-- BARRA SUPERIOR (TOP NAVBAR) -->
  <header
    class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-4 shrink-0 z-20"
  >
    <!-- Esquerda: Logo e Menus -->
    <div class="flex items-center h-full">
      <div class="flex items-center gap-2 mr-8">
        <!-- Ícone placeholder para o logo -->
        <div
          class="w-8 h-8 bg-green-100 rounded flex items-center justify-center text-green-700 font-bold text-xs"
        >
          CA
        </div>
        <span class="font-bold text-sm hidden md:block">Centro Agrícola</span>
      </div>

      <nav class="hidden md:flex h-full">
        <a
          href="#"
          class="flex items-center px-4 h-full border-b-2 border-green-600 text-green-700 font-bold text-sm"
          >Mis atenciones</a
        >
        <a
          href="#"
          class="flex items-center px-4 h-full text-gray-500 hover:text-gray-900 font-medium text-sm transition-colors"
          >Mis clientes</a
        >
      </nav>
    </div>

    <!-- Direita: Perfil e Configurações -->
    <div class="flex items-center gap-4">
      <div class="hidden md:flex flex-col text-right">
        <span class="text-sm font-bold leading-tight text-gray-900">{{ usuarioNome }}</span>
        <span class="text-[11px] text-gray-500">{{ usuarioPerfil }}</span>
      </div>
      <div
        class="w-8 h-8 rounded-full bg-green-700 text-white flex items-center justify-center font-bold text-xs shadow-sm"
      >
        {{ iniciais(usuarioNome) }}
      </div>

      <div class="h-6 w-px bg-gray-300 hidden md:block"></div>

      <div class="hidden md:flex items-center gap-1">
        <button
          class="px-2 py-1 text-xs font-bold bg-gray-100 rounded text-gray-700 border border-gray-200"
        >
          ES
        </button>
        <button class="px-2 py-1 text-xs font-medium text-gray-500 hover:bg-gray-50 rounded">
          PT
        </button>
      </div>

      <button class="text-gray-400 hover:text-gray-600 hidden md:block">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
          ></path>
        </svg>
      </button>

      <button (click)="sair()" class="text-sm font-medium text-gray-500 hover:text-gray-900">Salir</button>

      <!-- Botão Menu Mobile -->
      <button (click)="toggleMenu()" class="md:hidden text-gray-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- CORPO PRINCIPAL -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- Overlay Mobile -->
    <div
      *ngIf="menuMobileAberto"
      (click)="toggleMenu()"
      class="absolute inset-0 bg-black/50 z-30 md:hidden"
    ></div>

    <!-- Barra Lateral -->
    <app-sidebar
      class="absolute md:relative z-40 h-full w-80 md:w-80 lg:w-[350px] bg-white border-r border-gray-200 transform transition-transform duration-300 md:translate-x-0 flex flex-col shrink-0"
      [ngClass]="menuMobileAberto ? 'translate-x-0' : '-translate-x-full'"
    >
    </app-sidebar>

    <!-- Área de Chat -->
    <main class="flex-1 min-w-0 h-full bg-[#f8f9fa] flex flex-col">
      <app-chat-area class="flex-1 flex flex-col h-full"></app-chat-area>
    </main>
  </div>
</div>
