<div class="flex flex-col h-screen bg-white font-sans overflow-hidden text-gray-800">
  <!-- BARRA SUPERIOR (TOP NAVBAR IDÊNTICA AO MOCKUP) -->
  <header
    class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-3 md:px-5 shrink-0 z-20"
  >
    <!-- Esquerda: Botão Gaveta Mobile + Logo + Abas em Pílula -->
    <div class="flex items-center gap-2 md:gap-5">
      <button
        (click)="toggleMenu()"
        class="md:hidden p-1.5 text-gray-600 hover:bg-gray-100 rounded-lg"
        title="Abrir lista"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>

      <div class="flex items-center gap-2">
        <div
          class="w-8 h-8 bg-[#0a3a2a] rounded-lg flex items-center justify-center text-white font-bold text-xs shadow-sm"
        >
          🌾
        </div>
        <span class="font-bold text-sm text-[#0a3a2a] hidden sm:block">Centro Agrícola</span>
      </div>

      <nav class="flex items-center bg-gray-100 p-1 rounded-xl border border-gray-200">
        <button
          (click)="irParaAtenciones()"
          [ngClass]="
            abaSuperior === 'ATENCIONES'
              ? 'bg-white text-gray-900 font-bold shadow-sm border border-gray-200/80'
              : 'text-gray-600 hover:text-gray-900 font-medium'
          "
          class="px-3 py-1 rounded-lg text-xs transition-all"
        >
          Mis atenciones
        </button>
        <button
          (click)="irParaClientes()"
          [ngClass]="
            abaSuperior === 'CLIENTES'
              ? 'bg-white text-gray-900 font-bold shadow-sm border border-gray-200/80'
              : 'text-gray-600 hover:text-gray-900 font-medium'
          "
          class="px-3 py-1 rounded-lg text-xs transition-all"
        >
          Mis clientes
        </button>
      </nav>
    </div>

    <!-- Direita: Perfil, Idioma, Tela Cheia e Salir -->
    <div class="flex items-center gap-2.5 md:gap-3">
      @if (usuarioPerfil === 'ADMIN') {
        <button
          (click)="voltarAoAdmin()"
          class="px-2.5 py-1 text-xs font-bold bg-[#0a3a2a] text-white rounded-lg hover:bg-green-900 transition-colors shadow-sm"
        >
          Panel Admin
        </button>
      }

      <div class="hidden sm:flex flex-col text-right">
        <span class="text-xs font-bold leading-tight text-gray-900">{{ usuarioNome }}</span>
        <span class="text-[11px] text-gray-500">{{ subtituloCargo }}</span>
      </div>

      <div
        class="w-8 h-8 rounded-full bg-[#0a3a2a] text-white flex items-center justify-center font-bold text-xs shadow-sm"
      >
        {{ iniciais(usuarioNome) }}
      </div>

      <!-- Botões de Idioma ES / PT -->
      <div class="hidden md:flex items-center bg-gray-100 p-0.5 rounded-lg border border-gray-200">
        <button
          (click)="idioma = 'ES'"
          [ngClass]="
            idioma === 'ES' ? 'bg-white text-gray-900 font-bold shadow-sm' : 'text-gray-500'
          "
          class="px-2 py-0.5 text-[11px] rounded-md transition-all"
        >
          ES
        </button>
        <button
          (click)="idioma = 'PT'"
          [ngClass]="
            idioma === 'PT' ? 'bg-white text-gray-900 font-bold shadow-sm' : 'text-gray-500'
          "
          class="px-2 py-0.5 text-[11px] rounded-md transition-all"
        >
          PT
        </button>
      </div>

      <!-- Botão Tela Cheia -->
      <button
        (click)="toggleTelaCheia()"
        title="Modo pantalla completa"
        [ngClass]="
          emTelaCheia
            ? 'text-green-700 bg-green-50 border-green-300'
            : 'text-gray-500 hover:text-gray-800 hover:bg-gray-50 border-gray-200'
        "
        class="p-1.5 border rounded-lg transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"
          ></path>
        </svg>
      </button>

      <button (click)="sair()" class="text-xs font-medium text-gray-600 hover:text-gray-900 px-1">
        Salir
      </button>
    </div>
  </header>

  <!-- CORPO PRINCIPAL: SIDEBAR ESQUERDA + CHAT CENTRAL/DIREITA -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- Fundo escuro quando menu mobile está aberto -->
    <div
      *ngIf="menuMobileAberto"
      (click)="toggleMenu()"
      class="absolute inset-0 bg-black/50 z-30 md:hidden"
    ></div>

    <app-sidebar
      class="absolute md:relative z-40 h-full w-80 lg:w-[340px] bg-white border-r border-gray-200 transform transition-transform duration-300 md:translate-x-0 flex flex-col shrink-0"
      [ngClass]="menuMobileAberto ? 'translate-x-0' : '-translate-x-full'"
    >
    </app-sidebar>

    <main class="flex-1 min-w-0 h-full bg-[#f8f9fa] flex flex-col">
      <app-chat-area class="flex-1 flex flex-col h-full"></app-chat-area>
    </main>
  </div>
</div>
